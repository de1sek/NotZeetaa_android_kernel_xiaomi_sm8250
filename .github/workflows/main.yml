name: Build Mi10S (thyme) Kernel
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig 名称 (相对 arch/arm64/configs/)"
        required: false
        default: "vendor/thyme_defconfig"
  push:
    branches: [ "main" ]
env:
  # 保持与源码 .circleci 脚本一致的架构与产物路径
  ARCH: arm64
  OUT_DIR: out
  CCACHE_DIR: /home/runner/.ccache
jobs:
  build:
    # ubuntu-22.04 已从 2026-09-17 开始弃用，2027-04-17 后完全下线；
    # 这里固定使用 ubuntu-24.04，并已验证 libtinfo5 修复方法在其上同样有效。
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          # 修复点①：原来的 fetch-depth: 0 会让 actions/checkout 拉取
          # "所有分支 + 所有 tag" 的完整历史。这个内核仓库有 CAF、CAF_MSM、
          # PELT、WALT、beta、beta2、dfod、lineage-18.1、mglru-slmk、
          # mglru-staging、rebase、rebase2、staging、uclamp、udfps、
          # ups-udfps 等 16 个以上分支，实测仅这一步就耗时约 4 分钟，
          # 占了整个 job 运行时间的绝大部分，且这些历史数据对编译内核
          # 毫无用处——make 只需要当前 commit 的源码树。
          # 改为浅克隆(fetch-depth: 1)，只拉取当前分支最新一次提交，
          # 检出速度可从几分钟降到几秒/十几秒。
          # 副作用说明：如果 scripts/setlocalversion 依赖 git describe
          # 来生成内核版本号里的 commit 后缀，浅克隆下可能拿不到匹配的
          # tag，这只会让版本字符串少一段信息，不会导致编译失败。如果
          # 你确实需要完整的 git describe 信息，可以把下面改成
          # fetch-depth: 0，但建议只在必要时才这样做。
          fetch-depth: 1
      - name: 安装编译依赖 (标准 Linux 内核 + Android CAF 内核所需)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex \
            libssl-dev libelf-dev openssl \
            build-essential git curl wget \
            rsync cpio \
            ccache
      # -------------------------------------------------------------------
      # 关键修复：proton-clang 的预编译 clang 依赖 libtinfo.so.5，
      # 而 ubuntu-24.04 / 22.04 镜像默认只带 libtinfo6，必须手动补装，
      # 否则第一次调用 clang 就会直接报错退出，编译无法进行。
      # -------------------------------------------------------------------
      - name: 修复 libtinfo5 (proton-clang 预编译 clang 运行依赖)
        run: |
          # 修复点②：不要再硬编码具体的 .deb 文件名/版本号直链下载。
          # 原脚本写死了 libtinfo5_6.3-2ubuntu0.1_amd64.deb，但 Ubuntu
          # 官方在 2026-07-02 发布了 ncurses 安全更新，jammy-security 源
          # 上的 libtinfo5 已升级为 6.3-2ubuntu0.2，旧版本 0.1 的 .deb
          # 文件随即从 security.ubuntu.com 的 pool 目录里被删除，
          # 于是 wget 直链返回 404，进程以 exit code 8 结束
          # (wget: 服务器返回了错误响应)。
          # 这里改为临时挂载 jammy-security 源，让 apt 自己解析"当前"
          # 可用的 libtinfo5 版本再安装，装完立刻移除这个源，不影响
          # 后续针对 noble(24.04) 的 apt 操作。这样即使以后 Ubuntu 再发
          # 安全更新、版本号再变化，这一步也不会失效。
          echo "deb http://security.ubuntu.com/ubuntu jammy-security universe" \
            | sudo tee /etc/apt/sources.list.d/jammy-security-libtinfo5.list
          sudo apt-get update
          sudo apt-get install -y libtinfo5
          sudo rm -f /etc/apt/sources.list.d/jammy-security-libtinfo5.list
          sudo apt-get update
      # -------------------------------------------------------------------
      # 修复点③：proton-clang 是一份完整预编译的 LLVM/Clang + binutils
      # 工具链仓库，即使 --depth=1 只克隆最新一次提交，那次提交本身的文件
      # 内容(clang、lld、各架构头文件与库)体积仍有 1GB+。实测 git clone
      # 这一步"下载数据包"就要花约 90 秒，本地把 1110 个文件写盘反而只要
      # 几秒钟——慢在网络传输，不是检出逻辑本身，--depth=1 已经是能做的
      # 极限了。该工具链自 2021-05-22 (LLVM 13.0.0 / binutils 2.36.1) 起
      # 就再未更新，事实上已"冻结"，因此用固定 key 缓存起来，命中缓存后
      # 可以跳过这 90 秒的下载。
      # -------------------------------------------------------------------
      - name: 缓存 Proton Clang 工具链
        id: proton-clang-cache
        uses: actions/cache@v4
        with:
          # 注意：这里用固定的 /home/runner 而不是 ${{ env.HOME }}，
          # 因为 HOME 是 runner 进程的环境变量，未必能在 GitHub Actions
          # 表达式的 env 上下文里取到；ubuntu-24.04 hosted runner 的
          # $HOME 固定就是 /home/runner。
          path: /home/runner/proton-clang
          key: proton-clang-20210522
      - name: 克隆 Proton Clang 工具链 (仅缓存未命中时执行；源码 .circleci/build.sh 中指定的工具链)
        if: steps.proton-clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "${HOME}/proton-clang"
      - name: 校验工具链可用性
        run: |
          # 修复点④：这里以及后面两步都改成把 proton-clang/bin 追加到
          # PATH 末尾，而不是放在最前面(不再使用 $GITHUB_PATH，因为它固定
          # 会把路径插到最前面，没法控制顺序)。
          # 原因：proton-clang 自带的 ld 是 2021 年的 GNU Binutils 2.36.1，
          # 不认识 Ubuntu 24.04 glibc 采用的新版 RELR 压缩重定位格式，链接
          # 编译内核所需的 host 工具(如 fixdep，用系统自带 gcc 编译)时
          # 会报 "unknown type [0x13] section `.relr.dyn'" 并失败——因为
          # gcc 内部调用裸名 ld 完全依赖 PATH 查找(用 `gcc
          # -print-prog-name=ld` 可以验证 gcc 并不内置私有的 ld)，原来的
          # PATH 顺序让它优先找到 proton-clang 里那个旧 ld，而不是系统自带、
          # 与系统 libc 版本匹配的 /usr/bin/ld。
          # 追加到末尾后：clang、aarch64-linux-gnu-ld、arm-linux-gnueabi-ld
          # 这些只有 proton-clang 提供的工具依然能正常找到(不受顺序影响)，
          # 而编译 host 工具时用到的裸名 ld/as 会优先使用系统自带版本，
          # 从而避免这个兼容性问题。
          export PATH="$PATH:${HOME}/proton-clang/bin"
          clang --version
          aarch64-linux-gnu-ld -v
          arm-linux-gnueabi-ld -v
      - name: 启用 ccache 缓存 (加速重复编译，非必需但强烈建议)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-thyme-${{ github.sha }}
          restore-keys: |
            ccache-thyme-
      - name: 生成 defconfig
        run: |
          export PATH="$PATH:${HOME}/proton-clang/bin"
          make O=${OUT_DIR} ARCH=arm64 ${{ github.event.inputs.defconfig || 'vendor/thyme_defconfig' }}
      - name: 编译内核 (只产出 Image)
        run: |
          export PATH="$PATH:${HOME}/proton-clang/bin"
          export USE_CCACHE=1
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="ci"
          make -j$(nproc --all) O=${OUT_DIR} \
            ARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image \
            2>&1 | tee build.log
      - name: 校验 Image 是否生成
        run: |
          test -f ${OUT_DIR}/arch/arm64/boot/Image
          echo "Image 已生成"
      - name: 上传 Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thyme-Image-${{ github.run_number }}
          path: out/arch/arm64/boot/Image
          retention-days: 14
      - name: 上传编译日志 (无论成功失败都上传，便于排错)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 14
